loss_function: mutual_info

mutual_info_loss:
  estimator: variational
  density_estimator: gmm
  dim_summary_fac: 1
  kwargs:
    num_components: 4
    num_hidden_layers: 2
    num_hidden_units: 128
    activation: relu
    full_covariance: true
  regu:
    z_layer: last
    z_type: vicreg
    z_weight:
      variance: 1.0
      covariance: 1.0
      invariance: 1.0
