loss_function: mutual_info

mutual_info_loss:
  estimator: variational
  density_estimator: gmm      # Cls pipeline: selects backend
  dim_summary_fac: 2          # Map pipeline: summary_dim = dim_summary_fac x n_params
  kwargs:
    num_components: 4
    num_hidden_layers: 2
    num_hidden_units: 128
    activation: relu
    full_covariance: true
  regu:
    z_weight: null
