# Richer variational head: normalizing-flow q(theta|s) instead of the 4-component GMM.
# A flow is a strictly more expressive MI-bound estimator, so it tightens the variational
# lower bound and pushes the summary to encode more information -- WITHOUT enlarging the
# summary itself (dim_summary_fac stays 1, the only calibrated setting; fac=2 in vmim_flow.yaml
# produced overconfident posteriors, see v28_vmim). Capacity is bumped vs vmim_flow.yaml since
# the flow no longer carries the extra summary dimensions. The flow head is discarded at
# inference (it only shapes training), so this cannot affect downstream NLE overconfidence.
# Note: flow heads are less stable to train than GMMs -- fall back to vmim_head8.yaml if it diverges.

loss_function: mutual_info

mutual_info_loss:
  estimator: variational
  density_estimator: flow
  dim_summary_fac: 1
  kwargs:
    num_hidden_layers: 2
    num_hidden_units: 128
    activation: relu
    num_layers: 6
    scale_eps: 1.0e-5
    log_scale_clip: 5.0
  regu:
    z_weight: null
