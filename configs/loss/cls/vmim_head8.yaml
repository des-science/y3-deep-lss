# Stable fallback to the flow head (vmim_flow_fac1.yaml): keep the GMM variational q(theta|s)
# but make it richer -- 8 components (vs 4) and wider/deeper -- to tighten the MI lower bound.
# As with the flow head this only shapes training and leaves dim_summary_fac=1, so the summary
# dimension (and hence downstream NLE overconfidence behaviour) is unchanged.

loss_function: mutual_info

mutual_info_loss:
  estimator: variational
  density_estimator: gmm
  dim_summary_fac: 1
  kwargs:
    num_components: 8
    num_hidden_layers: 3
    num_hidden_units: 256
    activation: relu
    full_covariance: true
  regu:
    z_weight: null
