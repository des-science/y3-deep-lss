# Nested hierarchical local-window transformer — combined probes, maps only.
# No Cls branch (no `cls:` block): the transformer output is the summary statistic directly.
# Architecture mirrors the lensing maps.yaml (base 32, 4 heads, 4 global blocks, no LayerScale,
# input-norm layer + head dropout). Clustering is smoothed at nside 256 with its own kernel
# (per-probe smooth_nside) and upsampled back; lensing stays at the native n_side.
name: nested_transformer

training:
  # local_batch_size 20 is the max that comfortably fits (83 GB / 120 GB on a GH200; 24 OOMs) at
  # full-res lensing — same memory envelope as the lensing maps.yaml. 120k steps (uniform across
  # probes) ~= 9.5 h on 4 GPUs (~3.5 steps/s effective, ~9% slower/step than lensing per benchmark).
  n_steps: 120000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # per-probe smoothing resolution: clustering (fwhm >= 57') is smoothed at nside 256 and
  # upsampled back; lensing stays at the native n_side. See scale_cuts.clustering.theta_fwhm_base
  # in the scales config for the matching base kernel choice.
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  head:
    dropout_rate: 0.1
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 4
    mlp_ratio: 4
    layerscale_init: null

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 20
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
