# Nested hierarchical local-window transformer — combined probes, maps + Cls.
# bench_t2 (combined): optimize the healthy t1_cls combined reference (mock FoM 3297 / grid_med
# 2405 / DES 1845, already ~1.4x the DeepSphere v8_cls best) with the knobs that transferred from
# the clustering bench_t2 sweep. Each config here toggles knobs on top of ../maps+cls.yaml.
#
# b20_260k: the matched-updates lever — 2x the base's n_steps at the same batch and cosine
# schedule, spread over two chained jobs. Buys 2x optimizer updates AND 2x examples with no
# small-batch efficiency loss (contrast b10.yaml: 2x updates at ~0.85x examples/s in one job),
# and is the fairest comparison against the v8_cls DeepSphere ladder, which kept improving with
# steps (clustering 600k; combined flow @250k). Costs 2x GPU hours and a serialized ~24 h.
# The map transformer and the binned angular power spectra (lensing + clustering + cross pairs) are
# embedded separately and fused before the regression head. Architecture is the benchmarked winning
# base, bench_t8/default.yaml, same as lensing/maps+cls.yaml.
# Multi-resolution map branch: clustering is smoothed at nside 256 and INJECTED into the transformer
# hierarchy at the level already running at nside 256 (one merge below the nside-512 lensing input)
# rather than upsampled, so the network is one level deeper for lensing than for clustering (see
# HealpixMultiResMapEncoder).
# NOTE: masked_attention is unavailable on this multi-resolution (split_probes) path — probe
# injection and the token_valid attention mask are mutually exclusive in the core transformer, so
# build_map_encoder raises if it is enabled here. It is available in the single-resolution
# lensing/clustering configs.
name: nested_transformer

training:
  # TWO CHAINED 12 h JOBS, not one: 260k at b20 (~294 ms/step real) is ~21 h of training. Submit
  # job 1 normally and job 2 with RUN_NUM=2 --dependency=afterany:<job1>. Job 1 trains flat out
  # (~146k steps), is killed at the wall (TIMEOUT is expected, its eval tail never runs); job 2
  # restores the last checkpoint and run_training resumes from the restored step (n_steps is the
  # TOTAL budget), trains the remaining ~115-120k (~9.8 h), then runs the eval+inference tail.
  # The cosine span is n_steps, and the restored optimizer.iterations puts the LR back on the
  # curve, so the schedule is seamless across the handoff.
  # checkpoint_every is halved to 5000 (~25 min of work at risk at the wall kill instead of ~50).
  #
  # Memory note from the base: batch 20 -> 82.3 GB peak. Do not raise the batch: 24 -> 96.4 GB
  # is past the ~85 GB band above which the multi-GPU NCCL all-reduce deadlocks (mid-run, silently),
  # and 28 OOMs. Injecting clustering rather than upsampling it costs only ~34k params over
  # lensing-only (19.71 M vs 19.68 M map body), so the memory envelope matches lensing.
  #
  # This step time assumes the 8wl,32gc scale cut, and this config is the most exposed to that
  # choice: it smooths both probes, and clustering gets its own base kernel applied repeatedly
  # (scale_cuts.clustering.theta_fwhm_base). Smoothing is a sparse matmul that runs eagerly (XLA
  # cannot compile tf.sparse.sparse_dense_matmul) and its non-zeros grow as theta_fwhm^2, so a
  # coarser cut adds wall time directly — 8wl,40gc widens the clustering kernels ~1.6x in area and
  # raises the rep count. Re-benchmark and re-pick n_steps before switching scales.
  n_steps: 260000
  output_every: Null
  checkpoint_every: 5000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # per-probe smoothing resolution: clustering (fwhm >= 57') is smoothed at nside 256 and injected
  # into the hierarchy at its native scale (see HealpixMultiResMapEncoder); lensing stays at the
  # native n_side. See scale_cuts.clustering.theta_fwhm_base in the scales config for the matching
  # base kernel choice.
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  map_feature_dim: 512
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    # residual-branch dropout inside every local and global block (variable-free)
    block_dropout_rate: null
    # positional encoding for the local window attention: null (position-free) or geodesic
    # (distance-kernel attention bias, zero-init so it starts at the baseline)
    pos_encoding: null
    # patch merge: concat (order-sensitive concat+Dense) or deepsets (child-permutation-invariant,
    # requires a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 20  # capped by the NCCL band, not by the OOM ceiling — see the n_steps note
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
