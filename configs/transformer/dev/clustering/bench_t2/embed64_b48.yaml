# Nested hierarchical local-window transformer — clustering, maps + Cls.
# bench_t2 sweep: the t1_cls clustering reference (../maps+cls.yaml) underperforms both DeepSphere
# (v8_cls) and its own v16-era transformer twins (t4/t5_cls at matched batch/steps); each config in
# this directory toggles one knob on top of that base to isolate the cause.
#
# embed64_b48: embed64 (base_embed_dim 32 -> 64) at the fill-memory batch instead of b20 --
# separates 'width helps' from a width x batch interaction if embed64 wins the sweep.
# Width rationale (from embed64.yaml): base_embed_dim 32 -> 64, matching the LENSING architecture stage-for-stage at the same
# absolute nside. Lensing (nside 512, 5 nested levels, growth double) runs 512->32d, 256->64d,
# 128->128d, 64->256d, 32->512d; clustering starts one level coarser (nside 256), so base 32 makes
# every stage HALF the lensing width at the same physical resolution. Base 64 restores the match:
# clustering becomes exactly "lensing minus its finest stage" (256->64d, 128->128d, 64->256d,
# 32->512d). Physics motivation: clustering's beyond-2pt info (count-field higher moments that
# break the s8-bg degeneracy) is small-scale and per-pixel S/N ~ O(1), so fine-stage width is where
# the DeepSphere GCNN (128ch x 7 nonlinear layers at nside 256-64) most out-muscles the base-32
# transformer stem.
#
# Sizing (batch 48 / 110k): same bench as embed64.yaml (job 2781545): b48 bench 209.8 ms/step x the
# measured ~1.5 synthetic->real overhead (embed64 b20: bench 92 ms vs real 141 ms) = ~315 ms ->
# ~3.15 steps/s; the ~158 ex/s/GPU loader ceiling would allow 3.3, so the run is compute-bound but
# close to the crossover. 110k steps = ~9.7 h (worst-case 2.9/s -> 10.5 h), eval+inference tail
# fits the 12 h wall. 110k x 192 global = 21.1M examples, ~t1's 23M. CAUTION: peak memory 79.2 GB
# single-GPU is inside but near the ~85 GB NCCL-safe band -- if the multi-GPU collective hangs at
# step 0, fall back to b32 (52.9 GB).
name: nested_transformer

training:
  n_steps: 110000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # clustering-only, so nside 256 is the finest active smooth_nside and becomes the network's working
  # resolution (resolve_smooth_nside): the pipeline downsamples the native-res maps to 256 and the
  # transformer runs on those ~4x fewer pixels (no upsample back to native, unlike combined).
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  masked_attention: false
  map_feature_dim: 512
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 64
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    block_dropout_rate: null
    pos_encoding: null
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 48
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
