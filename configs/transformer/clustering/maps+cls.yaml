# Nested hierarchical local-window transformer — clustering, maps + Cls.
# The map transformer and the binned angular power spectra are embedded separately and fused before
# the regression head. Architecture is the benchmarked winning base, bench_t8/default.yaml, same as
# lensing/maps+cls.yaml; the map branch runs at nside 256 (clustering-only, so smooth_nside 256 is
# the finest smoothing resolution — no upsample back).
name: nested_transformer

training:
  # ~10 h of training on 4x GH200 at batch 48, filling the 12 h wall with room for eval+inference.
  # This run is I/O-bound, not compute-bound (see the local_batch_size note), so n_steps is set by
  # the read rate rather than by the network.
  #
  # Step time assumes the 8wl,32gc scale cut. Smoothing is a sparse matmul that runs eagerly (XLA
  # cannot compile tf.sparse.sparse_dense_matmul) and its non-zeros grow as theta_fwhm^2. Being
  # I/O-bound, this config absorbs some extra smoothing for free, but a much coarser cut can push it
  # compute-bound — 8wl,40gc widens the clustering kernels ~1.6x in area. Re-time before switching.
  n_steps: 120000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # clustering-only, so nside 256 is the finest active smooth_nside and becomes the network's working
  # resolution (resolve_smooth_nside): the pipeline downsamples the native-res maps to 256 and the
  # transformer runs on those ~4x fewer pixels (no upsample back to native, unlike combined).
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  # exclude footprint-masked pixels from attention/merges/pooling (static mask constants only —
  # no checkpoint variables, toggling keeps the checkpoint lineage)
  masked_attention: false
  map_feature_dim: 512
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    # residual-branch dropout inside every local and global block (variable-free)
    block_dropout_rate: null
    # positional encoding for the local window attention: null (position-free) or geodesic
    # (distance-kernel attention bias, zero-init so it starts at the baseline)
    pos_encoding: null
    # patch merge: concat (order-sensitive concat+Dense) or deepsets (child-permutation-invariant,
    # requires a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      # 48, not 72: the run is I/O-bound. Maps are read at native res then downsampled to 256, so the
      # light nside-256 network starves and step time tracks bytes/step (i.e. batch). 72 gave ~2.2
      # steps/s => ~15 h for 120k; 48 (192 global) gives ~3.3 steps/s => ~10 h.
      local_batch_size: 48
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
