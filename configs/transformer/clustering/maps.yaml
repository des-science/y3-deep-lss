# Nested hierarchical local-window transformer — clustering, maps only.
# No Cls branch (no `cls:` block): the transformer output is the summary statistic directly.
# Architecture mirrors the lensing maps.yaml (base 32, 4 heads, 4 global blocks, no LayerScale,
# input-norm layer + head dropout), but the whole network runs at nside 256: clustering is the only
# active probe, so its smooth_nside 256 is the finest smoothing resolution and sets the input geometry.
name: nested_transformer

training:
  n_steps: 120000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # clustering-only, so nside 256 is the finest active smooth_nside and becomes the network's working
  # resolution (resolve_smooth_nside). The pipeline downsamples the native-res maps to 256
  # (parent_output_idx) and the transformer runs on those ~4x fewer pixels — there is NO upsample back
  # to native n_side (that happens only in combined, where lensing pins the network at native res).
  # Raw tfrecord I/O stays at native res (identical to lensing), so the dataloader values transfer.
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  head:
    dropout_rate: 0.1
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 4
    mlp_ratio: 4
    layerscale_init: null

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      # local_batch_size 48 (not 72): the run is I/O-bound, not compute-bound. Maps are read at
      # native res then downsampled to 256, so the light nside-256 network starves — step time scales
      # with the ~bytes/step (batch), and batch 72 gave ~2.2 steps/s => ~15 h for 120k. Batch 48
      # (192 global) => ~3.3 steps/s => ~10 h, keeping n_steps uniform with the other probes.
      local_batch_size: 48
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
