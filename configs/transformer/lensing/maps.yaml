# Nested hierarchical local-window transformer — lensing, maps only.
# No Cls branch (no `cls:` block, no map_feature_dim): the transformer output is the summary
# statistic directly. Otherwise identical to lensing/maps+cls.yaml — the benchmarked winning base,
# bench_t8/default.yaml.
name: nested_transformer

training:
  # Unified cross-probe recipe (dev/notes/transformer_v17_unified_recipe_2026-07-19.md): batch 20,
  # cosine. 150k = ~11 h at the measured 3.85 it/s -> one 12 h job; 150k is this probe's optimum
  # (250k regressed on all FoM variants). Batch is capped by the ~85 GB NCCL-deadlock band
  # (24 -> 95 GB), not the OOM ceiling. Step time assumes the 8wl,32gc cut (eager smoothing ~theta_fwhm^2).
  n_steps: 150000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # sparse-matmul backend for the Gaussian smoothing front-end (the transformer body has no
  # graph convs): coo / csr (cuSPARSE) / gather (XLA). See deepsphere.utils.make_spmm_operator.
  # csr is numerically equivalent to coo up to fp32 tolerance and measured faster (-46..-54%).
  spmm_backend: csr
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  # exclude footprint-masked pixels from attention/merges/pooling (static mask constants only —
  # no checkpoint variables, toggling keeps the checkpoint lineage)
  masked_attention: false
  head:
    dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    # residual-branch dropout inside every local and global block (variable-free)
    block_dropout_rate: null
    # positional encoding for the local window attention: null (position-free) or geodesic
    # (distance-kernel attention bias, zero-init so it starts at the baseline)
    pos_encoding: null
    # patch merge: concat (order-sensitive concat+Dense) or deepsets (child-permutation-invariant,
    # requires a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 20  # capped by the NCCL band, not by the OOM ceiling — see the n_steps note
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
