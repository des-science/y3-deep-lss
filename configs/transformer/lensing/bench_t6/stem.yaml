# Nested hierarchical local-window transformer — lensing, maps + Cls.
# bench_t5 variant: default.yaml + patchified stem (stem_levels 1, base_embed_dim 32 -> 64).
# The finest nested level is folded into the input projection (one linear embed of
# 4 pixels x 4 channels = 16 values per nside-256 patch — lossless, since 64 >= 16),
# so the hierarchy starts one level coarser and the memory-dominant nside-512 stage
# disappears. base_embed_dim doubles to keep the top dim at 1024 (body dims
# [64, 128, 256, 512, 1024]); under growth: double the per-stage dense FLOPs are
# ~constant, so this is roughly cost-neutral vs default.yaml. The 13.7 arcmin token
# scale stays at ~Nyquist of the finest smoothing FWHM (12.6 arcmin); stem_levels: 2
# (27.5 arcmin patches) is the aggressive follow-up and would start to linearize real
# structure for the two least-smoothed bins.
name: nested_transformer

training:
  n_steps: 120000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  # exclude footprint-masked pixels from attention/merges/pooling (static mask
  # constants only — no checkpoint variables, toggling keeps the lineage)
  masked_attention: false
  map_feature_dim: 512
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 64 # the variant: doubled so the top dim stays 1024 with 4 body levels
    growth: double
    num_heads: 4
    window_levels: 3
    # the variant: patchified stem — fold the finest nested level into the input
    # projection; the hierarchy starts at nside 256 with 4 local stages instead of 5
    stem_levels: 1
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    # residual-branch dropout inside every local and global block (variable-free)
    block_dropout_rate: null
    # positional encoding for the local window attention: null (position-free) or
    # geodesic (distance-kernel attention bias, zero-init so it starts at the baseline)
    pos_encoding: null
    # patch merge: concat (order-sensitive concat+Dense) or deepsets
    # (child-permutation-invariant, requires a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 20
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
