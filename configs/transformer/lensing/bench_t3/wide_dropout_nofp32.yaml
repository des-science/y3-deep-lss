# Nested hierarchical local-window transformer — lensing, maps only.
# No Cls branch (no cls_n_bins): the transformer output is the summary statistic directly.
# wide_dropout (WIDE trunk base_embed_dim 32 + DROPOUT head 0.1) with the fp32 attention-softmax
# upcast DISABLED (fp32_softmax: false). Removing the upcast frees ~9% peak memory (the fp32 score
# tensor). Single-GPU benchmark: b24 fits (90.85 GB) but on the real 4-GPU mirrored run b24 DEADLOCKED
# at step 0 in the NCCL all-reduce (job 2690415) — the wide arch's 57M-param gradients make the NCCL
# comm buffers too large at that memory margin (cf. base-16 configs where 24 was the safe fix). Fell
# back to b22 (~84.5 GB single-GPU, ~same footprint as the known-good wide_dropout@b20-fp32on 83 GB).
# Throughput is flat (~107 ex/s, compute-bound), so the larger batch buys effective batch size, not
# wall-clock. n_steps scaled to keep ~the same samples seen as wide_dropout@b20 (20*120000 = 2.40M/GPU;
# 22*109000 = 2.40M/GPU) and the same ~10 h wall budget.
name: nested_transformer

training:
  n_steps: 109000  # 22*109000 ~= 20*120000 = 2.40M samples/GPU of wide_dropout@b20; ~10 h leaving eval+inference margin
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  head:
    dropout_rate: 0.1
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 4
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: false  # disable the fp32 attention-softmax upcast (fp32 LayerNorm remains the stabilizer)

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 22  # b24 fit single-GPU but deadlocked 4-GPU NCCL at step 0 (job 2690415); b22 ~84.5 GB is the safe ceiling
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
