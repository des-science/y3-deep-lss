# Variant of debug/maps.yaml — CONSTANT growth ablation (lensing, maps only).
#
# Growth ablation at the fixed nside=512 / token_nside=16 geometry (L=5 nested
# levels, 4^5=1024 pixels/token, N=448 occupied DES-Y3 footprint tokens, padding-free).
# growth=constant keeps a uniform width at every resolution level: with
# base_embed_dim=64 the channel ladder is [64,64,64,64,64,64] (final dim 64). The final
# global self-attention over the N=448 tokens runs at dim 64, so it is far cheaper than
# the growth=double baseline (final dim 512). This isolates whether *growing* channels
# while coarsening resolution actually helps the learned summary, vs. spending the same
# width uniformly across scales.
name: nested_transformer

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  # smooth_nside: 256
  z_bank_size: Null
  max_checkpoints: 50
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 64       # [64,64,64,64,64,64] across the 5 nested levels (final 64)
    growth: constant # constant | double | full | 128
    num_heads: 4
    window_levels: 3 # local attention window = 4^window_levels tokens
    local_blocks_per_level: 1
    global_blocks: 2
    mlp_ratio: 4

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
