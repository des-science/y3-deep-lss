# Variant of debug/maps.yaml — WIDER model (lensing, maps only).
#
# Doubles the embedding width (base_embed_dim 16 -> 32). With growth=double and 5 nested
# levels (nside 512 / token_nside 16) the channel dims become [32,64,128,256,512,1024],
# so the final per-token / global-attention dim doubles to 1024. num_heads -> 8 keeps a
# sane key_dim (>= 4) at every level (every dim is divisible by 8). Tests whether the
# summary is capacity-limited at the baseline width. Heaviest of the variants: global
# attention runs over N = 12*16^2 = 3072 tokens at dim 1024.
name: nested_transformer

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  # smooth_nside: 256
  z_bank_size: Null
  max_checkpoints: 50
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32         # [32,64,128,256,512,1024] across the 5 nested levels
    growth: double # constant | double | full | 128
    num_heads: 8               # key_dim = dim/8 >= 4 at every level
    window_levels: 3 # local attention window = 4^window_levels tokens
    local_blocks_per_level: 1
    global_blocks: 2
    mlp_ratio: 4

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
