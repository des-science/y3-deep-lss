# Variant of debug/maps.yaml — FULL-superpixel local window (lensing, maps only).
#
# Local-window ablation at the fixed nside=512 / token_nside=16 geometry (L=5 nested
# levels, 4^5=1024 pixels/token, N=448 occupied DES-Y3 footprint tokens, padding-free).
# Architecture is the baseline (base_embed_dim=16, growth=double -> [16,32,64,128,256,512])
# but window_levels=5 (= L). At each stage the local window is capped by the nested
# levels still present, so the finest stage attends over the *entire* 4^5=1024-pixel
# superpixel (1024-length attention), the next over 256, etc. This is the maximal
# intra-token receptive field and the heaviest local attention — the dominant cost moves
# to the finest, most-populated stage. Counterpoint to maps_window1.yaml.
name: nested_transformer

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  # smooth_nside: 256
  z_bank_size: Null
  max_checkpoints: 50
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 16
    growth: double # constant | double | full | 128
    num_heads: 4
    window_levels: 5 # local attention window = 4^min(5, levels_left); finest stage = full 1024-pixel superpixel
    local_blocks_per_level: 1
    global_blocks: 2
    mlp_ratio: 4

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
