# Nested hierarchical local-window transformer — lensing, maps + Cls.
# Built as a pre-assembled tf.keras.Model: HealpySmoothing -> HealpixNestedTokenizer ->
# transformer (map branch) fused with the binned-Cls branch.
name: nested_transformer

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  # smooth_nside: 256
  z_bank_size: Null
  max_checkpoints: 50
  # XLA-fuse the tokenizer->transformer body (smoothing stays eager, sparse op is XLA-incompatible).
  # Math-preserving; cuts the many tiny attention/layernorm/reshape kernel launches that dominate runtime.
  jit_compile_body: false
  precision: float32 # float32 | float16 | bfloat16 (overridden by --mixed_precision CLI)
  map_feature_dim: 256
  head:                 # post-fusion regression head (over the concatenated map + Cls vector)
    fused_layers: []
    dropout_rate: 0.1
  cls:                  # PRESENCE of this block enables the maps+cls path
    n_bins: 16
    # transform in the Cls branch (ClsBinningAndTransformLayer):
    #   log1p_fixed        -> sign(x)*log1p(|x|/1e-10) with a fixed knee
    #   asinh_per_feature  -> asinh(x/s), s = median|C_l| per (pair, ell-bin) fitted from the cached
    #                         binned Cls ({data_dir}/cls/rebinned_nb{n_bins}_{scales}.h5) and stored
    #                         in the checkpoint.
    transform: asinh_per_feature
    # asinh calibration fallback when the cache is absent:
    #   null  -> require the cache; the run aborts with a clear error if it is missing
    #   float -> uniform fixed-knee fallback (with a warning)
    asinh_default_scale: null
    embedding_layers: [1024, 1024, 1024, 1024]
    embedding_dropout_rate: 0.5
  kwargs:  # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double          # constant | double | full | 128
    num_heads: 4
    window_levels: 3        # local attention window = 4^window_levels tokens
    local_blocks_per_level: 1
    global_blocks: 2
    mlp_ratio: 4

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 4
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 4
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 4
