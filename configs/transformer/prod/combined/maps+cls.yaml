# Nested hierarchical local-window transformer — combined probes, maps + Cls.
# The map transformer and the binned angular power spectra (lensing + clustering + cross pairs) are
# embedded separately and fused before the regression head. Architecture is the benchmarked winning
# base, bench_t8/default.yaml, same as lensing/maps+cls.yaml.
# Multi-resolution map branch: clustering is smoothed at nside 256 and INJECTED into the transformer
# hierarchy at the level already running at nside 256 (one merge below the nside-512 lensing input)
# rather than upsampled, so the network is one level deeper for lensing than for clustering (see
# HealpixMultiResMapEncoder).
# NOTE: masked_attention is unavailable on this multi-resolution (split_probes) path — probe
# injection and the token_valid attention mask are mutually exclusive in the core transformer, so
# build_map_encoder raises if it is enabled here. It is available in the single-resolution
# lensing/clustering configs.
# TWO KEYS DIFFER VS maps.yaml -- this `cls:` BLOCK and `map_feature_dim` -- and the second
# exists only because of the first: map_feature_dim is the width the map feature is projected to
# for the concatenation, crushing the encoder's 1024-d pooled feature (base_embed_dim 32, growth
# double, nside 512 -> token_nside 16 = 5 levels) to the 512 that matches the Cls embedding.
# Maps-only there is nothing to balance and it is null. The GCNN prod pair needs no such second
# key: its pooled map is 512-d already, so both its files say null and they diff by cls: alone.
# Everything else here is identical -- one TransformerSummaryNetwork, one map encoder, one head.
name: nested_transformer

training:
  n_steps: auto  # an OUTPUT of the wall-clock budget; see throughput.json
  wall_budget_seconds: 79200  # TRAINING seconds for the WHOLE run -- 2 x 12 h chain
  job_budget_seconds: 39600  # this job's share (11 h of 12 h; ~1 h for the eval tail)
  output_every: Null
  checkpoint_every: 5000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # coo / csr (cuSPARSE) / gather (XLA); csr is numerically equivalent and faster
  spmm_backend: csr
  # per-probe smoothing resolution: clustering (fwhm >= 57') is smoothed at nside 256 and injected
  # into the hierarchy at its native scale (see HealpixMultiResMapEncoder); lensing stays at the
  # native n_side. See scale_cuts.clustering.theta_fwhm_base in the scales config for the matching
  # base kernel choice.
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  map_feature_dim: 512  # map-branch width AT THE CONCAT, matched to the Cls embedding width
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    block_dropout_rate: null
    # null (position-free) or geodesic (distance-kernel attention bias)
    pos_encoding: null
    # concat (order-sensitive concat+Dense) or deepsets (needs a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 16  # matched to the DeepSphere prod batch; inside the ~85 GB NCCL-safe band
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
