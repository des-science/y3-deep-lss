# Nested hierarchical local-window transformer — lensing, maps only.
# TWO KEYS DIFFER VS maps+cls.yaml -- the `cls:` BLOCK and `map_feature_dim` -- and the second
# exists only because of the first. Both paths build one TransformerSummaryNetwork over the same
# map encoder and the same regression head; the cls: block decides whether a Cls branch is
# concatenated onto the map feature, and map_feature_dim is the width the map feature is
# projected to FOR that concatenation. Here there is nothing to balance, so it is null: the
# mean-pooled encoder feature goes straight into the regression head, whose
# LayerNorm -> Dropout -> Dense is the only linear layer, and a projection would stack two Dense
# layers with no activation between them. The key may equally be omitted (absent = None); it is
# kept so the pair carries the same key SET and the diff is one value.
# The GCNN prod pair does differ by the cls: block alone, and only because its arithmetic works
# out: base_channels 64 x 3 pool_layers = a 512-d pooled map, already matching the 512-d Cls
# embedding, so BOTH its files say null. Here the encoder ends at 1024 (base_embed_dim 32,
# growth double, nside 512 -> token_nside 16 = 5 levels), so maps+cls has to crush it to 512.
# There is no readout choice here as there is on the GCNN: the transformer ends in a mean pool
# over tokens on both paths (nested_transformer.py, `reduce_mean(x, axis=1)`), so map_pool has
# no meaning and is not a key.
# NOT YET BENCHMARKED maps-only: this path used to end in the encoder's own Dense(n_output) and
# now ends in the shared regression head (LN -> Dropout -> Dense), one linear layer either way.
# No transformer maps-only run exists on any dataset, so nothing on disk is invalidated -- but
# nothing validates it either.
# Otherwise identical to lensing/maps+cls.yaml — the benchmarked winning base,
# bench_t8/default.yaml.
name: nested_transformer

training:
  n_steps: auto  # an OUTPUT of the wall-clock budget; see throughput.json
  wall_budget_seconds: 39600  # TRAINING seconds for the WHOLE run -- 1 x 12 h job
  job_budget_seconds: 39600  # this job's share (11 h of 12 h; ~1 h for the eval tail)
  output_every: Null
  checkpoint_every: 5000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # coo / csr (cuSPARSE) / gather (XLA); csr is numerically equivalent and faster
  spmm_backend: csr
  token_nside: 16
  map_feature_dim: null  # no projection: nothing to balance against, so the head's Dense is enough
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  # exclude footprint-masked pixels from attention/merges/pooling (keeps checkpoint lineage)
  masked_attention: false
  head:
    dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    block_dropout_rate: null
    # null (position-free) or geodesic (distance-kernel attention bias)
    pos_encoding: null
    # concat (order-sensitive concat+Dense) or deepsets (needs a pos_encoding)
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      local_batch_size: 16  # matched to the DeepSphere prod batch; inside the ~85 GB NCCL-safe band
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
