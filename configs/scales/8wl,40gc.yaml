scale_cuts:
  n_sigma_support: 3
  arcmin: True
  lensing:
    # 8 Mpc/h transverse comoving scale -> arcmin
    theta_fwhm: [29.5, 20.1, 15.0, 12.6]
    # 1 % noise threshold, l_maxs = [589, 863, 1159, 1382]
    white_noise_sigma: [3.0275e-4, 4.0448e-4, 4.8782e-4, 5.2049e-4]
    l_max: [589, 863, 1159, 1382]
    l_min: [30, 30, 30, 30]
  clustering:
    # 40 Mpc/h transverse comoving scale -> arcmin
    theta_fwhm: [162.8, 111.1, 85.2, 71.3]
    # 1 % noise threshold, l_maxs = [107, 156, 204, 244]
    white_noise_sigma: [1.1067e+0, 5.1717e-1, 5.1635e-1, 5.3947e-1]
    l_max: [107, 156, 204, 244]
    l_min: [30, 30, 30, 30]
