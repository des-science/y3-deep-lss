# bench_v5 variant of default.yaml — CONVNEXT RESIDUAL BODY.
# One-knob change vs the pool_head baseline: the residual body swaps the classic two-ChebK
# Healpy_ResidualLayer for the depthwise-separable ConvNeXt block (Healpy_ConvNeXtLayer,
# arXiv:2201.03545): a single depthwise ChebK conv (spatial mix, one spectral filter per channel) +
# LayerNorm + an inverted-bottleneck pointwise GELU MLP (mlp_ratio 4) + LayerScale (1e-6) + skip.
# One graph conv per block vs two => ~half the sparse L@x cost. DropPath (stochastic depth) is OFF in
# this baseline (drop_path_rate 0.0 = the no-DropPath default): at only 5 residual blocks it is a poor
# fit (stochastic depth targets EXTREME depth) and here it is applied FLAT (no linear ramp), so it is
# the exception, not the rule — the convnext_droppath.yaml sibling turns it on as the single ablation.
# Fresh checkpoint lineage.
name: deepsphere_default

training:
  n_steps: 210000  # RE-SIZED 2026-07-24 from the REAL 4-GPU rate (job 2892060 measured 5.71 it/s, not the synthetic 130.2 ms single-GPU bench -> convnext block scales ~40% worse across 4 GPUs). 210k/5.71 = 10.2 h train + ~0.6 h eval tail < 12 h. (was 230k = 11.8 h, knife-edge on the wall.)
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean
  map_feature_dim: null
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext  # <-- ConvNeXt block instead of the classic residual block
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.0  # no-DropPath default (see convnext_droppath.yaml for the single DropPath-on ablation)
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
