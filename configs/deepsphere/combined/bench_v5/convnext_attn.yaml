# bench_v5 variant — CONVNEXT BODY + INTERLEAVED GLOBAL ATTENTION (the hybrid).
#
# Deliberately STACKS the two bench_v5 levers that individually are not yet FoM-validated, because the
# ConvNeXt block's ~17% step-time saving (130 vs 156 ms) buys the wall-clock room for the attention at
# essentially no budget cost — the extra compute is worth the wall-time advantage (user call, 2026-07-24).
#
# The design (CoAtNet / MetaFormer, Dai+ 2021, arXiv:2106.04803): local rotation-equivariant graph conv
# for inductive bias + misspecification robustness, global content-dependent attention for the long-range
# CROSS-PROBE mixing that the bench_v4 analysis fingered as the combined-probe gap. Concretely this is a
# proper token-mix / channel-mix transformer body: the ConvNeXt block's depthwise ChebK conv is the LOCAL
# token-mixer and its inverted-bottleneck pointwise MLP is the channel-mixer, and HealpyGlobalAttention is
# interleaved as a GLOBAL token-mixer after every 2nd residual layer (after layers 2 and 4 of 5), inside
# the shared post-fusion body (ResNetMultiResEncoder.gcnn_post, nside 16, ~448 footprint tokens -> global
# attention is cheap and mixes the two FUSED probes exactly where 3x2pt cross-info lives).
#
# Two knobs vs the pool_head baseline (default.yaml): residual_block_type=convnext (+ its mlp_ratio/
# layer_scale/drop_path) AND residual_attention (+ _every). Note the two `mlp_ratio`/`layer_scale_init`
# live in DIFFERENT namespaces: the top-level kwargs (4 / 1e-6) configure the ConvNeXt block; the nested
# residual_attention dict (2.0 / 1e-4) configures the attention block. DropPath is OFF (drop_path_rate
# 0.0 = the no-DropPath default; see convnext_droppath.yaml). Fresh checkpoint lineage.
#
# Robustness: both residual streams start near-identity (ConvNeXt LayerScale 1e-6, attention LayerScale
# 1e-4 + zero-init pos-emb), so the equivariant convs do the early work and attention is learned on top —
# keeping DeepSphere's local inductive bias is the whole point.
name: deepsphere_default

training:
  # RE-SIZED 2026-07-24 from the REAL 4-GPU rate (job 2892063 measured 5.47 it/s, NOT the synthetic
  # 136.7 ms single-GPU bench -> the convnext body + interleaved attention scales ~40% worse across 4
  # GPUs than the single-GPU benchmark predicted). 200k/5.47 = 10.2 h train + ~0.6 h eval/infer tail
  # < 12 h. (was 220k = 11.8 h, knife-edge on the 12 h wall -> risked losing the eval tail.)
  n_steps: 200000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean
  map_feature_dim: null
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext  # <-- ConvNeXt block (cheap local body; token+channel mix)
    mlp_ratio: 4                   # ConvNeXt block MLP ratio
    layer_scale_init: 1.0e-6       # ConvNeXt block LayerScale
    drop_path_rate: 0.0            # DropPath OFF (the no-DropPath default; see convnext_droppath.yaml for the ablation)
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1
    # interleave a global-attention block after every 2nd residual layer (after 2 and 4 of 5), inside the
    # post-fusion body (nside 16). The GLOBAL token-mixer on top of the ConvNeXt local body/channel-mixer.
    residual_attention_every: 2
    residual_attention:
      num_heads: 4          # C=256 -> key_dim 64, matching the transformer body
      n_layers: 1
      mlp_ratio: 2.0        # attention-block MLP ratio (distinct from the ConvNeXt mlp_ratio above)
      dropout_rate: 0.1
      positional_embedding: true   # learnable per-token pos-emb over the fixed nside-16 footprint
      layer_scale_init: 1.0e-4     # near-identity init for stability + robustness

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
