# contains the model specific configuration parameters for training and hyperparameter optimization
name: deepsphere_default

training:
  # Sized for ~11 h of training on 4x GH200, same recipe as configs/transformer
  # (project_transformer_bench_sizing_recipe): n_steps via a K=1.45 synthetic-single-GPU ->
  # real-4-GPU-mirrored factor (inherited from the transformer calibration; not independently
  # re-measured for this GCNN).
  #
  # Not memory-bound (batch 32 -> only 6.9 GB peak, the multi-res ResNetMultiResEncoder body with
  # clustering injected at native nside 256 -- confirmed via benchmark_resnet.py's multires=True).
  # Throughput is close to flat with batch, so batch 32 was kept rather than the benchmarked-safe
  # ceiling of 128 (see project_resnet_gcnn_bench_sizing) and only n_steps was retuned for 11 h.
  #
  # batch 32 -> 6.9 GB / 316.1 ms synthetic step -> real ~458.3 ms/step (x1.45) -> 86k steps ~= 11.0 h.
  n_steps: 86000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  # adam or sgd
  optimizer: adam
  # this could also be handled in the optimizer instead of the training step
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    # EMA weight averaging (optional)
    ema_momentum: null

network:
  name: resnet
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  # standardize the smoothed maps with per-channel statistics measured from training data on
  # fresh runs and restored from the checkpoint otherwise (EmpiricalInputNormalization, same layer
  # and placement as the transformer encoders). Adds checkpoint variables -- remove only to restore
  # checkpoints from the pre-input-norm lineage.
  input_norm: true
  # per-probe smoothing resolution: clustering (fwhm >= 57') is smoothed at nside 256 and injected
  # into the GCNN after the pooling layer that already runs at nside 256 (ResNetMultiResEncoder,
  # concat+Dense fusion like the transformer injections); lensing stays at the native n_side.
  # Requires scale_cuts.clustering.theta_fwhm_base in the scales config (the base kernel applied
  # repeatedly at 256). New checkpoint lineage — remove only to restore single-resolution
  # checkpoints, which smooth all channels with one base kernel at min(fwhm) at full resolution.
  smooth_nside:
    clustering: 256
  # Maps+Cls: the presence of this `cls:` block enables the Cls branch (MapsPlusCLSNetwork); the
  # map GCNN and the binned angular power spectra (lensing + clustering + cross pairs) are embedded
  # separately and concatenated before the regression head. Same schema as
  # configs/transformer/combined/maps+cls.yaml.
  # Map-branch fusion: v1_cls concatenated the flattened GCNN features raw (114688-dim, 448 pixels
  # x 256 channels) against the Cls branch's 512-dim embedding -- a ~225x dimensionality mismatch
  # at the concat. v2_cls balances this: map_feature_dim inserts a Dense(114688->32) projection
  # before map_norm, and the Cls embedding_layers below is resized to end at 32 too, so both
  # branches contribute equally-sized vectors to the concat. Counter-intuitively this ADDS params
  # overall (the 114688->32 projection alone is ~3.67M) despite each branch being smaller after
  # fusion -- see project_maps_cls_dimensionality_balance memory. New checkpoint lineage.
  map_feature_dim: 32
  cls:
    # number of ell bins per cross pair
    n_bins: 16
    # asinh(x/s) with s = median|C_l| per (pair, ell-bin) fitted from the cached binned Cls
    # ({data_dir}/cls/rebinned_nb{n_bins}_{scales}.h5) and stored in the checkpoint.
    transform: asinh_per_feature
    # fallback uniform scale used only if the Cls cache is absent; null => require the cache
    asinh_default_scale: null
    # MLP widths for the Cls embedding branch (Dense→LN per entry); [] to disable
    # last entry = 32 to match map_feature_dim above (see comment there)
    embedding_layers: [512, 512, 512, 32]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    # depth
    downsampling_layers: 3
    cheby_layers: 2
    residual_layers: 5
    # misc
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 32
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
