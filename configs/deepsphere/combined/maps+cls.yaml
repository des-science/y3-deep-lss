# DeepSphere ResNet GCNN — combined probes, maps + Cls.
# The `cls:` block enables the Cls branch (MapsPlusCLSNetwork): the map GCNN and the binned angular
# power spectra (lensing + clustering + cross pairs) are embedded separately and concatenated before
# the regression head.
name: deepsphere_default

training:
  # Unified cross-probe recipe: batch 20, cosine. Combined does not fit one 12 h job — run as two
  # chained jobs via training.sh RUN_NUM (job 1 TIMEOUTs mid-training, resubmit RUN_NUM=2; n_steps is
  # the total budget). Sized to the measured ~3.3 it/s (11.9k/h): job 1 reaches ~160k, job 2 adds
  # ~120k + the eval+inference tail -> 280k total.
  n_steps: 280000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null  # optional EMA weight averaging

network:
  name: resnet
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  # EmpiricalInputNormalization: standardize the smoothed maps with per-channel training statistics
  # (restored from the checkpoint on resume). Adds checkpoint variables — its own lineage.
  input_norm: true
  # Multi-resolution: clustering (fwhm >= 57') is smoothed at nside 256 and injected into the GCNN
  # after the pooling layer already at nside 256 (ResNetMultiResEncoder, concat+Dense fusion); lensing
  # stays at native n_side. Needs scale_cuts.clustering.theta_fwhm_base in the scales config.
  smooth_nside:
    clustering: 256
  # map_feature_dim projects the flattened GCNN features (114688-dim) down to 64; the Cls branch
  # (embedding_layers below) ends at 64 too, so both contribute equally-sized vectors to the concat.
  # See project_maps_cls_dimensionality_balance. Own checkpoint lineage.
  map_feature_dim: 64
  cls:
    n_bins: 16  # ell bins per cross pair
    # asinh(x/s), s = median|C_l| per (pair, ell-bin) from the cached binned Cls
    # ({data_dir}/cls/rebinned_nb{n_bins}_{scales}.h5), stored in the checkpoint
    transform: asinh_per_feature
    asinh_default_scale: null  # fallback scale if the cache is absent; null => require it
    embedding_layers: [512, 512, 512, 64]  # Dense+LN per entry; last entry matches map_feature_dim
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    # depth
    downsampling_layers: 3
    cheby_layers: 2
    residual_layers: 5
    # misc
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 20
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
