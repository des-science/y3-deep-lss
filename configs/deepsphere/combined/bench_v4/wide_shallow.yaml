# bench_v4 variant of default.yaml — WIDE + SHALLOW (trade trunk depth for width).
# Two knobs (one idea): base_channels 32 -> 64 AND residual_layers 5 -> 2.
# Like w64 the deep body is 512 ch (fusion pinch 64), but the trunk is shallower: 2 residual
# graph convs instead of 5. w64 pays ~4x conv FLOPs for width at FULL depth and is slow
# (90k steps/11 h); this claws depth back to test whether the combined signal is capacity-limited
# more by WIDTH than by trunk DEPTH. Complementary to w64 (pure width, same depth) and deep_trunk
# (pure depth, default width). n_steps set from benchmark_v4. Watch the cuSPARSE nnz*Fout>2^31 limit.
name: deepsphere_default

training:
  n_steps: 150000  # batch 16: measured real train 8.63 h at 120k (job 2880791) + ~0.7 h eval/infer tail; resized 120k x 11.0/8.63 -> 150k (floor 10k) to fill ~11 h train
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  # sparse-matmul backend for the graph convs: csr = cuSPARSE csrmm (benchmarked winner, app default).
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_feature_dim: 64
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 64]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 64  # <-- WIDTH x2 (default 32); deep body 512, fusion pinch 64
    pool_layers: 3
    conv_layers: 2
    residual_layers: 2  # <-- SHALLOW trunk (default 5): trade depth for the base-64 width
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
