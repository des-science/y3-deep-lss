# contains the model specific configuration parameters for training and hyperparameter optimization
name: deepsphere_default

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  # adam or sgd
  optimizer: adam
  # this could also be handled in the optimizer instead of the training step
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    # EMA weight averaging (optional)
    ema_momentum: null

network:
  name: resnet
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  # number of ell bins per cross pair
  cls_n_bins: 16
  # Cls transform in the Cls branch (ClsBinningAndTransformLayer):
  #   log1p_fixed        -> sign(x)*log1p(|x|/1e-10) with a fixed knee (default if omitted)
  #   asinh_per_feature  -> asinh(x/s), s = median|C_l| per (pair, ell-bin) fitted from the cached
  #                         binned Cls ({data_dir}/cls/rebinned_nb{cls_n_bins}_{scales}.h5) and
  #                         stored in the checkpoint. Falls back to a uniform asinh_default_scale
  #                         (with a warning) if the cache is absent.
  cls_transform: asinh_per_feature
  asinh_default_scale: 1.0e-10
  # MLP widths for the Cls embedding branch (Dense→LN per entry); [] to disable
  cls_embedding_layers: [1024, 1024, 1024, 1024]
  cls_embedding_dropout_rate: 0.5
  kwargs:
    base_channels: 32
    # depth
    downsampling_layers: 3
    cheby_layers: 2
    residual_layers: 5
    # misc
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 32
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
