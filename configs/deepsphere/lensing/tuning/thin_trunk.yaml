# Tuning variant of default.yaml: shrink the receptive field to roughly ell ~ 15-20 (vs. the
# default's ell ~ 1, i.e. full sky) WITHOUT changing the downsampling schedule (still 512 -> 64,
# same as default.yaml, so the early/cheap layers are unchanged). Instead the graph-conv trunk is
# drastically thinned (1 residual block = 2 convs total, vs. 12 in default.yaml) and uses a
# smaller poly_degree/n_neighbors. Estimated ell ~ 17.
#
# Cheapest option of the tuning set, and a useful contrast: it shows that hitting ell ~ 20 with
# the default's aggressive downsampling requires an almost-trivial trunk, which likely costs
# network capacity (compare against less_downsampling.yaml / moderate_downsampling.yaml to see
# whether shallow-trunk-but-cheap beats deep-trunk-but-expensive for this task). If capacity
# turns out to be a problem, raise base_channels to add width without growing the receptive field.
name: deepsphere_thin_trunk

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  # adam or sgd
  optimizer: adam
  # this could also be handled in the optimizer instead of the training step
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0

network:
  name: resnet
  n_neighbors: 8
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  kwargs:
    base_channels: 32
    # depth: same downsampling schedule as default.yaml (512 -> 64), but a much thinner trunk
    pool_layers: 3
    conv_layers: 0
    residual_layers: 1
    # misc
    poly_degree: 2
    head_type: "dense"
    dense_layers: Null
    dropout_rate: 0.01

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 32
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
