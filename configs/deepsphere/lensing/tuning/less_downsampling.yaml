# Tuning variant of default.yaml: shrink the receptive field to roughly ell ~ 15-20 (vs. the
# default's ell ~ 1, i.e. full sky) by downsampling much less aggressively and thinning/narrowing
# the graph-conv trunk. The rough estimate (Delta_theta ~ K * sqrt(n_neighbors) * pixel_size,
# summed over the resolution cascade 512 -> 256 -> 128, trunk at nside 128) gives ell ~ 15.
#
# Highest-fidelity / highest-compute option of the tuning set: feature maps stay at nside 128
# through most of the trunk (vs. nside 16 in default.yaml), preserving far more small-scale
# (high-ell) structure at the cost of much larger intermediate activations.
name: deepsphere_less_downsampling

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  # adam or sgd
  optimizer: adam
  # this could also be handled in the optimizer instead of the training step
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0

network:
  name: resnet
  n_neighbors: 8
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  kwargs:
    base_channels: 32
    # depth: nside cascade 512 -> 256 -> 128, trunk operates at nside 128
    downsampling_layers: 1
    cheby_layers: 1
    residual_layers: 2
    # misc
    poly_degree: 2
    head_type: "dense"
    dense_layers: Null
    dropout_rate: 0.01

dset:
  training:
    common:
      is_eval: False
      signal_indices: 0.8
      noise_indices: Null
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 32
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      signal_indices: 0.8
      noise_indices: Null
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      signal_indices: 0.8
      noise_indices: Null
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
