# contains the model specific configuration parameters for training and hyperparameter optimization
name: deepsphere_default

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  # adam or sgd
  optimizer: adam
  # this could also be handled in the optimizer instead of the training step
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    # EMA weight averaging (optional)
    ema_momentum: null

network:
  name: resnet
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  # standardize the smoothed maps with per-channel statistics measured from training data on
  # fresh runs and restored from the checkpoint otherwise (EmpiricalInputNormalization, same layer
  # and placement as the transformer encoders). Adds checkpoint variables -- remove only to restore
  # checkpoints from the pre-input-norm lineage.
  input_norm: true
  # Maps+Cls: the presence of this `cls:` block enables the Cls branch (MapsPlusCLSNetwork); the
  # map GCNN and the binned angular power spectra are embedded separately and concatenated before
  # the regression head. Same schema as configs/transformer/lensing/maps+cls.yaml.
  # Map-branch fusion: the flattened GCNN features (448 pixels x 256 channels = 114688) enter the
  # concatenation raw (LayerNorm per branch, no bottleneck) — same fusion as the maps-only dense
  # head and the v8_cls runs. Setting map_feature_dim: <width> would insert a linear Dense
  # projection before the branch LayerNorm instead (~59M params at 512, and a separate
  # checkpoint lineage).
  cls:
    # number of ell bins per cross pair
    n_bins: 16
    # Cls transform in the Cls branch (ClsBinningAndTransformLayer):
    #   log1p_fixed        -> sign(x)*log1p(|x|/1e-10) with a fixed knee
    #   asinh_per_feature  -> asinh(x/s), s = median|C_l| per (pair, ell-bin) fitted from the cached
    #                         binned Cls ({data_dir}/cls/rebinned_nb{n_bins}_{scales}.h5) and stored
    #                         in the checkpoint.
    transform: asinh_per_feature
    # fallback uniform scale used only if the Cls cache is absent; null => require the cache
    # (strict — the per-feature scale is the whole point of asinh_per_feature)
    asinh_default_scale: null
    # MLP widths for the Cls embedding branch (Dense→LN per entry); [] to disable
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    # depth
    downsampling_layers: 3
    cheby_layers: 2
    residual_layers: 5
    # misc
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 32
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
