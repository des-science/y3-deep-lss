# DeepSphere ResNet GCNN — lensing, maps only.
name: deepsphere_default

training:
  # Unified cross-probe recipe: batch 20, cosine (matches the transformer's per-probe sizing).
  # n_steps sized to the measured ~4.45 it/s (16k/h) to fill ~10.6 h training + the eval+inference
  # tail in one 12 h job.
  n_steps: 170000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null  # optional EMA weight averaging

network:
  name: resnet
  n_neighbors: 60
  # sparse-matmul backend for the graph convolutions AND per-probe smoothing kernels:
  # coo (generic TF kernel) / csr (cuSPARSE csrmm) / gather (XLA). See
  # deepsphere.utils.make_spmm_operator. csr is numerically equivalent to coo up to fp32
  # tolerance (no model/lineage change) and measured faster on this k=60 Laplacian
  # (convs -9..-17%, smoothing -46..-54%); n_steps unchanged, so training finishes early.
  spmm_backend: csr
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  # EmpiricalInputNormalization: standardize the smoothed maps with per-channel training statistics
  # (restored from the checkpoint on resume). Adds checkpoint variables — its own lineage.
  input_norm: true
  kwargs:
    base_channels: 32
    # depth
    downsampling_layers: 3
    cheby_layers: 2
    residual_layers: 5
    # misc
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 20
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 20
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 20
