# ============================================================================
# bench_v10 — CLUSTERING, "mean_std", 2 x 12 h.
#
# PARENT: clustering/bench_v7/full.yaml. THE ONLY ARCHITECTURE KNOB: map_pool "mean" -> "mean_std".
# The budget also changes (fixed n_steps: 130000 -> wall-clock 79.2 ks over a 2-job chain); that is
# the round's convention for every file in it, and the 1x sibling is what isolates it.
#
# WHY. bench_v8/v9 ran eleven arms on COMBINED and the readout was the only lever that ever paid:
# flatten -> mean +32.1%, mean -> mean_std +5.3% (bench_v8_mean_std, 1.053, the programme champion).
# Every trunk change lost, and moments -- one rung further up the ladder -- lost 12.2%. bench_v10 asks
# whether that single surviving knob transfers to the single probes, so that ONE architecture can be
# the default everywhere.
#
# Clustering is the probe where the transfer is LEAST obvious, and that is why it is worth measuring
# rather than assuming. The galaxy density field enters at nside 256 and is smoothed with a >= 57'
# kernel before the network sees it, so it is the least non-Gaussian of the three inputs and the one
# whose across-sky feature variance has the most chance of being redundant with its own Cls. It is
# also the probe where the trunk machinery mattered MOST (full beats simple by 8.5% here against 2.7%
# on lensing), so it is not a probe where readout-only conclusions transfer for free.
#
# GEOMETRY IS UNCHANGED FROM bench_v7. base_channels 128 (NOT 64) because pool_layers is 2 here:
# 128 * 2^2 = 512, the trunk width pinned across all three probes. With a pooled readout the trunk
# width IS the map-vector width, so base 64 would emit a 256-d map (512-d under mean_std) into a
# concat whose Cls branch contributes 512 -- silently unbalancing the fusion and breaking
# cross-probe comparability. See clustering/bench_v7/README.md.
#
# NEW CHECKPOINT LINEAGE (the readout width changes 512 -> 1024). RUN_NUM=1 into its own MODEL_DIR.
#
# SIZING: wall-clock budget, 79.2 ks over a 2-job chain -- EXACTLY 2x the 1x sibling, so the pair
# measures the step budget and nothing else. n_steps is an OUTPUT (throughput.json); at bench_v7's
# measured 3.59 it/s expect ~284 k. See combined/bench_v10/README.md for the round rationale.
# ============================================================================
name: deepsphere_default

training:
  n_steps: auto  # bounded by wall_budget_seconds alone; the step count reached is an OUTPUT
  wall_budget_seconds: 79200  # TRAINING seconds for the WHOLE run, summed across the 2-job chain
  job_budget_seconds: 39600  # this job's share (11 h of 12 h; ~1 h left for the eval tail)
  output_every: Null
  checkpoint_every: 5000  # job 2 restores the last checkpoint -- smaller = less lost handoff work
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  # Clustering (fwhm >= 57') gets its own smoothing kernel at nside 256 rather than at native nside.
  smooth_nside:
    clustering: 256
  map_pool: mean_std  # <-- THE ONLY ARCHITECTURE KNOB vs bench_v7/full.yaml: (B,512) -> (B,1024)
  map_feature_dim: null  # no projection: the 1024-d pooled map goes straight to map_norm + concat
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]  # 512 against a 1024-d map -- the inherited balance confound
    embedding_dropout_rate: 0.1
  kwargs:
    # base 128 (NOT 64) because pool_layers is 2 here: 128 * 2^2 = 512, the trunk width pinned across
    # all three probes. See the header -- with a pooled readout this is mechanical, not tidiness.
    base_channels: 128
    pool_layers: 2
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.1
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1
    residual_attention_every: 2  # body is nside 16 (~448 tokens)
    residual_attention:
      num_heads: 8          # body is 512 ch -> key_dim = 512/8 = 64, matching the transformer
      n_layers: 1
      mlp_ratio: 2.0        # attention-block MLP ratio (distinct from the ConvNeXt mlp_ratio above)
      dropout_rate: 0.1
      positional_embedding: true   # learnable per-token pos-emb over the fixed nside-16 footprint
      layer_scale_init: 1.0e-4     # near-identity init

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
