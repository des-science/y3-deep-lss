# bench_v4 variant of default.yaml — NONLINEAR FUSION HEAD.
# Knobs: network.kwargs.dense_layers [] -> [256], dropout_rate 0.1 -> null.
# The default maps+cls head fuses the map branch (64) and the Cls branch (64) with a single
# linear Dense to the ~9-dim summary (head = LayerNorm -> Dropout -> Dense). This variant
# inserts one nonlinear hidden layer (Dense(256, relu) -> LayerNorm) so the two branches are
# combined nonlinearly before the summary. dropout_rate must be null because the head asserts
# dropout and hidden dense_layers are mutually exclusive (regression_head.get_regression_head).
# Cheap (head-only change). NOTE: a transformer-like *mean-pool over pixels* in the map branch
# is NOT a config knob here — head_type: conv does not compose with the flatten in the maps+cls
# composite (it needs the graph); that would require composite code and is deferred.
name: deepsphere_default

training:
  n_steps: 180000  # batch 16: measured real train 10.73 h at 180k (job 2880787) + ~0.6 h eval/infer tail; already ~11 h (181k target floors to 180k), kept
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  # sparse-matmul backend for the graph convs: csr = cuSPARSE csrmm (benchmarked winner, app default).
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_feature_dim: 64
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 64]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    poly_degree: 5
    head_type: "dense"
    dense_layers: [256]   # <-- nonlinear fusion hidden layer (default [])
    dropout_rate: null    # <-- must be null: mutually exclusive with dense_layers (default 0.1)

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
