# bench_v5 variant of convnext.yaml — DROPPATH ON (the single stochastic-depth ablation).
# One-knob change vs convnext (which is now drop_path_rate 0.0 = the no-DropPath default): turn
# stochastic depth ON at drop_path_rate 0.1. Paired with convnext.yaml this attributes any grid->DES
# transfer gain to the DropPath regularizer specifically rather than to the ConvNeXt block structure.
# Caveat: at only 5 residual blocks DropPath is a weak fit (stochastic depth targets extreme depth) and
# is applied FLAT (no linear ramp), so this is the aggressive corner — which is why it is the exception,
# not the default.
name: deepsphere_default

training:
  n_steps: 200000  # RE-SIZED 2026-07-24 from the REAL 4-GPU rate (job 2892061 measured 5.39 it/s, not the synthetic 130.1 ms single-GPU bench). 200k/5.39 = 10.3 h train + ~0.6 h eval tail < 12 h. (was 230k = 12.5 h -> would TIMEOUT before finishing, losing the cosine tail + eval.)
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean
  map_feature_dim: null
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.1  # <-- DropPath ON (the single stochastic-depth ablation; convnext.yaml is now 0.0)
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
