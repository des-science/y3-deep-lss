# bench_v5 variant of convnext.yaml — DEEPER TRUNK AT EQUAL WALL-CLOCK.
# One-knob change vs convnext: residual_layers 5 -> 10. The ConvNeXt block has one graph conv per
# block (~1/2 the spmm of the residual block), so ~10 ConvNeXt blocks cost about what 5 residual
# blocks did — this variant spends that saving on depth. Tests whether depth helps once the block is
# cheap (bench_v4 deep_trunk added depth to the EXPENSIVE block and overfit grid->DES).
name: deepsphere_default

training:
  n_steps: 180000  # batch 16: benchmark_v5 167.8 ms/step (job 2888808/2889233); 10 ConvNeXt blocks land near the 5-block residual default; sized floor10k(30.31M/step_ms) -> ~11.0 h train + ~0.6 h eval tail < 12 h
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean
  map_feature_dim: null
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 10  # <-- deeper trunk; affordable because the ConvNeXt block is ~1/2 spmm
    residual_block_type: convnext
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.0  # no-DropPath default (see convnext_droppath.yaml for the single DropPath-on ablation)
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
