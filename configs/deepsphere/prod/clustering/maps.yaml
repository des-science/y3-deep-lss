# DeepSphere ResNet GCNN -- clustering (GCNN runs at nside 256), maps only.
# Architecture: bench_v7 `full` -- see ../../dev/clustering/bench_v7/ for the rationale.
# NOTE: the pooled map readout (map_pool) exists only on the maps+Cls path
# (ResNetMapsPlusCLSNetwork); this config keeps the flatten head.
name: deepsphere_default

training:
  n_steps: auto  # an OUTPUT of the wall-clock budget; see throughput.json
  wall_budget_seconds: 39600  # TRAINING seconds for the WHOLE run -- 1 x 12 h
  job_budget_seconds: 39600  # this job's share (11 h of 12 h; ~1 h for the eval tail)
  output_every: Null
  checkpoint_every: 5000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  n_neighbors: 60
  spmm_backend: csr
  smooth_nside:
    clustering: 256
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  kwargs:
    base_channels: 128  # trunk = base_channels * 2^pool_layers = 512, pinned across probes
    pool_layers: 2
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.1
    residual_attention_every: 2
    residual_attention:
      num_heads: 8
      n_layers: 1
      mlp_ratio: 2.0
      dropout_rate: 0.1
      positional_embedding: true
      layer_scale_init: 1.0e-4
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
