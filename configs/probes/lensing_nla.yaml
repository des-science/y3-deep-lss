# Standard-NLA lensing: like lensing.yaml but without bta, for datasets built with
# extended_nla: False (msfm configs/v17+). On such data the msfm all_params list has no bta, so
# the bta-containing probes configs fail at the param-column gather; conversely, do not use this
# config on v16-and-earlier extended-NLA datasets (the compressor would silently marginalize ds).
dset:
  common:
    with_lensing: True
    with_clustering: False
    with_cross_z: True
    with_cross_probe: False
    apply_norm: True
  training:
    params: [Om, s8, w0, Aia, n_Aia]
  eval:
    fiducial:
      params: []
    grid:
      params: [Om, s8, w0, Aia, n_Aia]
