# dset.training.params defaults to every label the maps depend on, resolved from the msfm config
# (configuration.resolve_params). A list of labels and msfm groups, like [cosmo, ia], overrides it.
dset:
  common:
    with_lensing: True
    with_clustering: True
    with_cross_z: True
    with_cross_probe: True
    apply_norm: True
  eval:
    fiducial:
      params: []
