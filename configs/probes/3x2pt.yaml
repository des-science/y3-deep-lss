dset:
  common:
    with_lensing: True
    with_clustering: True
    # cosmic shear keeps its cross-z bins; galaxy clustering is auto-z only (DES Y3 3x2pt)
    with_cross_z:
      lensing: True
      clustering: False
    with_cross_probe: True
    lenses_before_sources: True
    apply_norm: True
  training:
    params: [Om, s8, w0, Aia, n_Aia, bta, bg1, bg2, bg3, bg4]
  eval:
    fiducial:
      params: []
    grid:
      params: [Om, s8, w0, Aia, n_Aia, bta, bg1, bg2, bg3, bg4]
