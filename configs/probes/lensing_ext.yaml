# Lensing with the VMIM target extended by the grid parameters that are otherwise implicitly
# marginalized at compression (ns, Ob, H0, bary_Mc, bary_nu). Constraining-power test: the joint
# variational posterior rewards summaries that retain the (Om, S8)-xi degeneracy directions
# instead of averaging over them.
#
# IMPORTANT: the params list must follow the all_params order from msfm parameters.get_parameters
# (cosmo -> bary -> ia) because the Cls label gather in msi preprocessing.get_binned_power_spectra
# returns columns in all_params order, NOT in the requested order. The default 6-param lists only
# work because they happen to coincide with the all_params order.
dset:
  common:
    with_lensing: True
    with_clustering: False
    with_cross_z: True
    with_cross_probe: False
    apply_norm: True
  training:
    params: [Om, s8, Ob, H0, ns, w0, bary_Mc, bary_nu, Aia, n_Aia, bta]
  eval:
    fiducial:
      params: []
    grid:
      params: [Om, s8, Ob, H0, ns, w0, bary_Mc, bary_nu, Aia, n_Aia, bta]
