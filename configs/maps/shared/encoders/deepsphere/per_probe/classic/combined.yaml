# Classic-block GCNN, combined probes. Pairs with ../../classic.yaml, which must come FIRST in the
# extends: list. Not shared with the convnext family, which takes stage lists instead.
#
# Both probes active: lensing stays at the native n_side while clustering is smoothed at nside 256
# and injected there, so the network takes lensing's 64 x 3 rather than clustering's 128 x 2. See
# scale_cuts.clustering.theta_fwhm_base in the scales config for the matching base kernel.

network:
  smooth_nside:
    clustering: 256
  kwargs:
    base_channels: 64  # trunk = base_channels * 2^pool_layers = 512, pinned across probes
    pool_layers: 3
