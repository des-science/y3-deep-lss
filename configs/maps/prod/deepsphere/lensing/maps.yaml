# DeepSphere GCNN (classic residual block) -- lensing only, maps only.
# Composed from configs/maps/shared/; this file defines nothing itself. Resolved at load time
# and saved to the run dir FULLY RESOLVED, so a restore never re-resolves against an edited base.
# Do NOT grep it -- the keys are not in it:
#   python -m deep_lss.utils.config_check resolve <this file> --flat
#
# Partner maps+cls.yaml is this file plus the maps/shared/cls_branch.yaml base; one shared
# encoder, so the pair cannot disagree about the network.
#
# Family swap (-> convnext) means changing BOTH encoder lines: per_probe is namespaced by family
# because stage_widths is what selects the staged code path. See shared/encoders/deepsphere/.

extends:
  - maps/shared/dataloader.yaml
  - maps/shared/optimization.yaml
  - maps/shared/budget/1x12h.yaml
  - maps/shared/encoders/deepsphere/classic.yaml
  - maps/shared/encoders/deepsphere/per_probe/classic/lensing.yaml
