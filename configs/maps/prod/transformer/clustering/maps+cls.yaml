# Nested hierarchical local-window transformer — clustering, maps + Cls.
# The map transformer and the binned angular power spectra are embedded separately and fused before
# the regression head. Architecture is the benchmarked winning base, bench_t8/default.yaml, same as
# lensing/maps+cls.yaml; the map branch runs at nside 256 (clustering-only, so smooth_nside 256 is
# the finest smoothing resolution — no upsample back).
# ONE KEY DIFFERS VS maps.yaml -- this `cls:` BLOCK, which decides whether a Cls branch is
# concatenated onto the map feature. `map_feature_dim` is null in BOTH files: the pooled map
# feature enters the concatenation at its native width, with no projection Dense, so the fusion
# has the GCNN's shape -- pool -> LN -> concat -> head. It was 512 here until 2026-09-02, chosen
# to crush the pooled feature to the Cls embedding width; see the key itself for why that went.
# Everything else here is identical -- one TransformerSummaryNetwork, one map encoder, one head.
name: nested_transformer

training:
  n_steps: auto  # an OUTPUT of the wall-clock budget; see throughput.json
  wall_budget_seconds: 39600  # TRAINING seconds for the WHOLE run -- 1 x 12 h job
  job_budget_seconds: 39600  # this job's share (11 h of 12 h; ~1 h for the eval tail)
  output_every: Null
  checkpoint_every: 5000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  # coo / csr (cuSPARSE) / gather (XLA); csr is numerically equivalent and faster
  spmm_backend: csr
  # clustering-only, so nside 256 is the finest active smooth_nside and becomes the network's working
  # resolution (resolve_smooth_nside): the pipeline downsamples the native-res maps to 256 and the
  # transformer runs on those ~4x fewer pixels (no upsample back to native, unlike combined).
  # Raw tfrecord I/O stays at native res (identical to lensing), so the dataloader values transfer.
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  # exclude footprint-masked pixels from attention/merges/pooling (keeps checkpoint lineage)
  masked_attention: false
  map_feature_dim: null  # no projection: pool -> LN -> concat -> head, the GCNN's fusion shape.
                         # Was 512 (crushing the 1024-d pooled feature to the Cls embedding width)
                         # until 2026-09-02. bench_v12 is the only wall-matched, fully-annealed
                         # transformer measurement that exists and it was made at null, so prod
                         # now matches what was actually measured. NOT itself a benchmarked knob:
                         # it was held fixed across all three arms of that round.
  head:
    dropout_rate: 0.1  # KEEP IT ON. The one thing bench_v12 measured positively: turning it off
                       # (transformer_nodrop) cost 7.3% paired FoM against this config at matched
                       # 100% wall budget and near-identical steps -- well outside the 0.049 seed
                       # floor, and vali_total agreed independently (-6.51 vs -10.77). Measured on
                       # combined/maps+cls; carried to the other probes on the unified-recipe
                       # convention, not on a per-probe measurement.
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 64  # trunk = base_embed_dim * 2^levels = 1024, pinned across probes. THIS
                        # PROBE NEEDS 64: its map branch runs at nside 256, so 256 -> token_nside
                        # 16 is FOUR levels, not the five lensing/combined get from 512. Was 32
                        # until 2026-09-02, which gave a 512 trunk -- half the intended width,
                        # under a header that wrongly claimed five levels. That was a bug.
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    block_dropout_rate: null  # drops activations; drop_path_rate below drops whole branches
    drop_path_rate: 0.0  # OFF, and stated rather than left to the default so the negative result
                         # is recorded here. bench_v12 ran it at 0.1 with head dropout OFF and the
                         # loss went non-finite inside 100 steps on two independent inits (jobs
                         # 3242171, 3250568). It was never tried with head dropout ON, so read this
                         # as "off, and not worth another 12 h" rather than "off, proven".
                         # At 0.0 the DropPath layer is not constructed at all: a graph no-op, so
                         # adding this key does not touch checkpoint lineage.
    # null (position-free) or geodesic (distance-kernel attention bias)
    pos_encoding: null
    # concat (order-sensitive concat+Dense) or deepsets (needs a pos_encoding)
    merge_op: concat

dset:
  # CANONICAL DATALOADER -- every VALUE here is identical in all twelve prod configs, both
  # architectures and all three probes; local_batch_size is 16 throughout. Only comments differ,
  # and only where the fact does: the NCCL-band note is a transformer constraint (the GCNN is
  # not memory-bound), and clustering carries its own I/O-bound batch-sweep note.
  # n_workers MUST stay set. Left null, the interleave, parse and augment stages all go to
  # tf.data.AUTOTUNE, whose ram_budget defaults to half the NODE's memory -- on a GH200 that is half
  # of the 870 GB UNIFIED pool (Grace + HBM), so ~425 GiB against a 450 GiB cgroup, leaving nothing
  # for the model. Four bench_v12 GCNN jobs were OOM-killed 2-8 h in exactly that way (2026-09-01).
  # msfm now also caps the budget from SLURM_MEM_PER_NODE (base_pipeline.apply_autotune_ram_budget),
  # so this is belt and braces rather than the only guard.
  training:
    common:
      is_eval: False
      n_readers: 16
      n_prefetch: 4
      n_workers: 128
    grid:
      # I/O-bound (step time tracks bytes/step), so the smaller batch buys nearly free updates
      # (48 -> 3.3 it/s, 20 -> 7.34 it/s); b20/250k beat every b48/120k variant of the bench_t2 sweep
      local_batch_size: 16  # matched to the DeepSphere prod batch; inside the ~85 GB NCCL-safe band
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 1024
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 16
      n_prefetch: 2
      n_workers: 128
    grid:
      local_batch_size: 16
