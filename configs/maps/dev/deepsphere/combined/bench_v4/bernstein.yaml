# bench_v4 variant of default.yaml — SWAP THE CHEBYSHEV BASIS FOR BERNSTEIN, cost-matched at poly_degree 3.
# Two knobs vs default: network.kwargs.conv_type "cheby" -> "bernstein" AND poly_degree 5 -> 3.
#
# WHY (robustness motivation + fair compute): the point of DeepSphere over the transformer is its
# greater robustness to model misspecification (cf. the mock-contamination unblinding plots: v3_cls
# degrades far less than t2_cls). Bernstein filters (BernNet, arXiv:2106.10994) parametrize the SAME
# rotation-equivariant polynomial-in-L filter class as Chebyshev, but in the Bernstein basis, whose
# non-negative coefficients give a better-conditioned, more stable learned spectral response -- so
# this stays firmly inside the DeepSphere inductive bias (isotropic graph conv). A faithful K=5 basis
# swap costs ~3.4x Chebyshev's step time (20 vs 4 spmm/conv even after the cached-ladder Bernstein.call
# rewrite), which at fixed ~11 h wall-clock would train ~3.4x fewer steps -- an unfair handicap. We
# match on COMPUTE instead of polynomial order: at K=3 the Bernstein spmm count is K + K(K+1)/2 = 9
# (vs 20 at K=5), so the step time is only ~1.6x Chebyshev and it trains a comparable number of steps.
# BernNet's bet is that its well-conditioned basis needs a LOWER order than Chebyshev for a useful
# spectral response; a lower-order (smoother) filter is also less prone to overfit sharp fine-scale
# features -- consistent with the robustness motivation. conv_type switches BOTH the cheby-downsampling
# slots and the residual body (see ResNetLayers). Geometry otherwise UNCHANGED vs default (base 32 ->
# deep body 256 @ nside 16, pinch 32); note this variant has FEWER params than default (11.9M vs 13.4M,
# Bernstein kernel is (K+1)*Fin = 4*Fin wide at K=3 vs Chebyshev's K*Fin = 5*Fin at K=5).
name: deepsphere_default

training:
  n_steps: 120000  # batch 16: measured real train 9.08 h at 100k (job 2880774) + ~0.6 h eval/infer tail; resized 100k x 11.0/9.08 -> 120k (floor 10k) to fill ~11 h train
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_feature_dim: 64
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 64]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    poly_degree: 3         # <-- reduced order (default 5); Bernstein spmm/conv = 3 + 3*4/2 = 9 (vs 20 at K=5)
    conv_type: bernstein   # <-- Bernstein basis (default "cheby"); switches cheby-slots + residual body
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
