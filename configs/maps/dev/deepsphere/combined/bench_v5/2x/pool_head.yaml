# ============================================================================
# bench_v5 — LONGER (2x12 h chained) combined-probe GCNN runs, matching the transformer's budget.
# ----------------------------------------------------------------------------
# The reference transformer (t2_cls) was trained for TWO 12 h jobs; bench_v4 gave the GCNNs only ONE.
# bench_v5 re-runs the round-1 winners at the SAME 2x12 h budget, so the DeepSphere-vs-transformer
# comparison is finally like-for-like. Selection is driven by the bench_v4 structural analysis
# (see dev/notes/bench_v4_deepsphere_combined_2026-07-23.md, Round-1 RESULTS): the two positive levers
# were the READOUT (pool_head) and, more weakly, deep-body WIDTH (w64). bench_v5 = {pool_head (this
# file), w64, pool_head_w64 (the two stacked)}. Everything else (trunk depth, extra downsampling
# chebys / U-net, spectral basis, mlp head, attn, bilinear) was dropped as costly-without-benefit.
#
# THIS FILE = pool_head, the bench_v4 round-1 WINNER (grid FoM 2306 / DES 1785 / vali -9.98, best on all
# three, highest grid-FoM floor, cheapest). Verbatim copy of bench_v4/pool_head.yaml except the budget.
#
# CHAINED-RUN CONTRACT (run_training.py:1294): n_steps is the TOTAL step budget ACROSS the chain, and
# the cosine LR schedule spans it. Job 1 (RUN_NUM=1) trains until the 12 h wall (TIMEOUT, checkpoints
# only); job 2 (RUN_NUM=2, --restore_checkpoint) restores optimizer.iterations, trains the REMAINDER to
# n_steps on the same cosine curve, then runs eval + inference. So the follow-up MUST be chained with
#   --dependency=afterany  (NOT afterok: job 1 is EXPECTED to TIMEOUT, and afterok would not fire).
# training_chainer.sh currently hardcodes afterok/MAX_RUNS=3 -> launch the 2-job afterany chain by hand:
#   J1=$(ARCH=deepsphere PROBE=combined NET_CONFIG=$PWD/configs/deepsphere/combined/bench_v5/2x/pool_head.yaml \
#        MODEL_DIR=bench_v5_pool_head sbatch --parsable --job-name=bv5_pool_head \
#        --export=ALL,RUN_NUM=1 submissions/clariden/training.sh)
#   ARCH=deepsphere PROBE=combined NET_CONFIG=$PWD/configs/deepsphere/combined/bench_v5/2x/pool_head.yaml \
#        MODEL_DIR=bench_v5_pool_head sbatch --job-name=bv5_pool_head \
#        --dependency=afterany:$J1 --export=ALL,RUN_NUM=2 submissions/clariden/training.sh
# (A 3rd RUN_NUM=3 afterany job is a cheap safety net if job 2 also TIMEOUTs before finishing training.)
# ============================================================================
name: deepsphere_default

training:
  # TOTAL budget across the 2x12 h chain (cosine spans this; job 2 trains the remainder).
  n_steps: 380000  # ~22 h total train: round-1 pool_head = 4.89 real it/s (180k in 10.23 h, job 2880789) x 79.2 ks (2x~11 h), floor 10k
  output_every: Null
  checkpoint_every: 5000  # halved from 10k: at TIMEOUT job 2 restores the last checkpoint, so smaller = less lost handoff work
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  # sparse-matmul backend for the graph convs: csr = cuSPARSE csrmm (benchmarked winner, app default).
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean  # <-- mean-pool over pixels instead of flatten (default: flatten) -- the winning readout
  map_feature_dim: null  # <-- no projection: pooled map is already 256-d (default 64 was for the flatten crush)
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]  # <-- Cls embedding to 256 to balance the 256-d pooled map; fused = 512
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 32
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
