# bench_v5 variant of convnext.yaml — WIDTH x2.
# One-knob change vs convnext: base_channels 32 -> 64 (deep body 256 -> 512, fusion pinch 32 -> 64).
# bench_v4 found capacity was NOT the lever for the classic residual body (w64 barely moved), but the
# ConvNeXt block spends width differently — the pointwise inverted-bottleneck MLP is 2*mlp_ratio*C^2,
# so doubling C is where a ConvNeXt block actually grows. Tests the capacity hypothesis on the new
# block structure; ~4x the pointwise-MLP FLOPs -> slower per step, so LOWER n_steps to fit one 12 h job.
name: deepsphere_default

training:
  n_steps: 120000  # batch 16: benchmark_v5 239.4 ms/step (job 2888808/2889233), slowest (params 4.75->15.8 M, MLP ~4x); sized floor10k(30.31M/step_ms) -> ~10.4 h train + ~0.6 h eval tail < 12 h
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: resnet
  spmm_backend: csr
  n_neighbors: 60
  max_checkpoints: 50
  save_second_to_last_layer: False
  z_bank_size: Null
  input_norm: true
  smooth_nside:
    clustering: 256
  map_pool: mean
  map_feature_dim: null
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 256]
    embedding_dropout_rate: 0.1
  kwargs:
    base_channels: 64  # <-- WIDTH x2 (default 32); deep body 512, fusion pinch 64
    pool_layers: 3
    conv_layers: 2
    residual_layers: 5
    residual_block_type: convnext
    mlp_ratio: 4
    layer_scale_init: 1.0e-6
    drop_path_rate: 0.0  # no-DropPath default (see convnext_droppath.yaml for the single DropPath-on ablation)
    poly_degree: 5
    head_type: "dense"
    dense_layers: []
    dropout_rate: 0.1

dset:
  training:
    common:
      is_eval: False
      n_readers: 32
      n_prefetch: 4
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
