# Variant of debug/maps.yaml — ADDITIVE ("128") growth ablation (lensing, maps only).
#
# Growth ablation at the fixed nside=512 / token_nside=16 geometry (L=5 nested
# levels, 4^5=1024 pixels/token, N=448 occupied DES-Y3 footprint tokens, padding-free).
# growth="128" adds a fixed 128 channels per merge instead of multiplying: with
# base_embed_dim=16 the channel ladder is [16,144,272,400,528,656] (final dim 656). This
# is a near-linear width schedule — between constant (flat) and double (geometric) — that
# puts comparatively more capacity into the *fine/mid* levels relative to the coarse
# global stage. Both 16 and 128 are divisible by num_heads=4, so every level is valid.
#
# NOTE: growth must be the *quoted* string "128"; make_channel_dims compares the string
# "128", so an unquoted YAML 128 (an int) would fail with a ValueError.
name: nested_transformer

training:
  n_steps: 100000
  output_every: Null
  checkpoint_every: 10000
  vali_every: 1000
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: Null
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  token_nside: 16
  # smooth_nside: 256
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: false # fp32+XLA OOMs at batch 16 here; needs bf16 (pending smoothing carve-out) or no XLA
  precision: float32 # bf16 parked: halves memory but the eager sparse smoothing has no fast bf16 kernel (~10x slower) until smoothing is carved out to fp32
  kwargs: # -> NestedHierarchicalLocalWindowTransformer
    base_embed_dim: 16       # [16,144,272,400,528,656] across the 5 nested levels (final 656)
    growth: "128" # constant | double | full | 128  (MUST be quoted)
    num_heads: 4
    window_levels: 3 # local attention window = 4^window_levels tokens
    local_blocks_per_level: 1
    global_blocks: 2
    mlp_ratio: 4

dset:
  training:
    common:
      is_eval: False
      n_readers: 64
      n_prefetch: 8
      n_workers: Null
    grid:
      local_batch_size: 16
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 50
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 64
      n_prefetch: 2
      n_workers: Null
    grid:
      local_batch_size: 16
