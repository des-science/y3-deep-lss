# bench_2node b20: throughput-scaling multi-worker variant. local_batch_size 20 PER REPLICA:
# 2 nodes = 8 replicas = global batch 160 (double the production recipe — NOT update-equivalent,
# informative for a b40-global/125k-step alternative); 1 node = 4 tasks = global 80 (strategy-cost
# control vs mirrored ctrl_b20). Loader knobs scaled per task as in b10.
# n_steps 1300 + vali_every Null: pure step rate over the pasc window (steps 200-1200).
name: nested_transformer

training:
  n_steps: 1300
  output_every: Null
  checkpoint_every: 10000
  vali_every: Null
  eval_every: Null

optimization:
  optimizer: adam
  gradient_clipping:
    clip_by_value: null
    clip_by_norm: null
    clip_by_global_norm: 1.0
  mutual_info_loss:
    learning_rate: 1.0e-4
    optimizer_kwargs:
      beta_1: 0.9
      beta_2: 0.999
    scheduler: cosine
    warmup_steps: 5000
    warmup_init_learning_rate: 1.0e-5
    decay_alpha: 0.0
    ema_momentum: null

network:
  name: nested_transformer
  smooth_nside:
    clustering: 256
  token_nside: 16
  z_bank_size: Null
  max_checkpoints: 50
  jit_compile_body: true
  precision: bfloat16
  input_norm: true
  masked_attention: false
  map_feature_dim: 512
  head:
    dropout_rate: 0.1
  cls:
    n_bins: 16
    transform: asinh_per_feature
    asinh_default_scale: null
    embedding_layers: [512, 512, 512, 512]
    embedding_dropout_rate: 0.1
  kwargs: # -> HealpixNestedHierarchicalLocalWindowTransformer
    base_embed_dim: 32
    growth: double
    num_heads: 4
    window_levels: 3
    local_blocks_per_level: 1
    global_blocks: 1
    mlp_ratio: 4
    layerscale_init: null
    fp32_softmax: true
    block_dropout_rate: null
    pos_encoding: null
    merge_op: concat

dset:
  training:
    common:
      is_eval: False
      n_readers: 8
      n_prefetch: 4
      n_workers: 64
    grid:
      local_batch_size: 20
      file_name_shuffle_buffer: 64
      examples_shuffle_buffer: 256
  validation:
    n_batches: 100
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 16
    grid:
      local_batch_size: 16
  eval:
    common:
      is_eval: True
      n_readers: 8
      n_prefetch: 2
      n_workers: 64
    grid:
      local_batch_size: 16
