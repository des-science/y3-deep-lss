# Optimizer/SCHEDULE probe: cosine decay to ~1% of the peak LR (lr_alpha) over the full run, with
# warmup, instead of the constant LR of default.yaml. Same net as the baseline so the schedule is
# the only variable vs bench_m1/default.yaml (and a counterpart to bench_m1/plateau.yaml, which
# reduces LR reactively rather than on a fixed cosine). A decaying LR usually sharpens the final
# minimum -> lower marginal sigma. lr_alpha is written as a decimal on purpose: it is passed to
# CosineDecay without a float() cast, so bare scientific notation (1e-2) would arrive as a string.

# Network architecture
num_hidden_units: 1024
num_layers: 4
dropout_rate: 0.1
normalization: layer
activation: relu

# Data
scale_cut: hard_rebinned
cls_n_bins: 16
cls_transform: asinh_per_feature

# PCA
pca_components: null
pca_whiten: false

# Training
n_steps: 1000000
batch_size: 1024
learning_rate: 1e-4
weight_decay: 1e-2
clip_by_global_norm: 1.0

lr_schedule: cosine
lr_warmup_steps: 5000
lr_alpha: 0.01 # final LR = lr_alpha * learning_rate

early_stopping:
  patience: 15
  min_delta: 5e-2
  min_steps: 10000

# EMA weight averaging
ema_momentum: null

# Logging / checkpointing
log_every: 100
vali_every: 5000

# Compilation
xla: true

# Reproducibility
seed: 42
deterministic_ops: false
