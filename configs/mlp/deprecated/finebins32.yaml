# Identical to default.yaml except cls_n_bins: 16 -> 32 (see finebins24.yaml for rationale).
# Points at a new cache rebinned_nb32_<scales>.h5, built once automatically.

# Network architecture
num_hidden_units: 1024
num_layers: 4
dropout_rate: 0.1
normalization: layer
activation: relu

# Data
apply_log: true
scale_cut: hard_rebinned
cls_n_bins: 32

# PCA
pca_components: null

# Training
n_steps: 1000000
batch_size: 1024
learning_rate: 1e-4
weight_decay: 1e-2
clip_by_global_norm: 1.0
lr_schedule: constant
early_stopping:
  patience: 5
  min_delta: 1e-2
  min_steps: 10000

# EMA weight averaging
ema_momentum: null

# Logging / checkpointing
log_every: 100
vali_every: 5000

# Compilation
xla: true

# Reproducibility
seed: 42
deterministic_ops: false
