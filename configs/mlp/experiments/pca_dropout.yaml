# Network architecture
num_hidden_units: 1024
num_layers: 4
dropout_rate: 0.5
normalization: layer
activation: relu

# PCA
pca_components: 9999
pca_whiten: false

# Training
n_steps: 1000000
batch_size: 1024
learning_rate: 1e-4
weight_decay: 1e-3
clip_by_global_norm: 1.0
lr_schedule: constant
early_stopping:
  patience: 2
  min_delta: 1e-2
  min_steps: 10000

# Data
signal_indices: 0.8
noise_indices: Null
apply_log: true

# Logging / checkpointing
log_every: 100
vali_every: 5000

# Compilation
xla: true
