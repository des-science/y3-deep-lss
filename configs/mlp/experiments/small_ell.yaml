# Network architecture — same as small.yaml (shallow, wide)
num_hidden_units: 1024
num_layers: 2
dropout_rate: 0.1
normalization: layer
activation: relu

# Training
n_steps: 500000
batch_size: 1024
learning_rate: 1e-4
clip_by_global_norm: 1.0

# Learning rate schedule
lr_schedule: constant

# Preprocessing: ell-weighted raw C_ℓ (no log transform).
# log(ell * C_ell) = log(C_ell) + log(ell) — PCA mean-subtraction cancels the log(ell) term,
# so ell_weighting is only meaningful when apply_log=false.
apply_log: false
ell_weighting: ell

# Logging / checkpointing
log_every: 100
vali_every: 10000

# XLA compilation (speeds up GPU training step ~20-40%)
xla: true
