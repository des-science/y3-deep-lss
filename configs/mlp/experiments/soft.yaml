# Network architecture
num_hidden_units: 1024
num_layers: 4
dropout_rate: 0.1
normalization: layer
activation: relu

# PCA
pca_components: 9999
pca_whiten: false

# Training
n_steps: 1000000
batch_size: 1024
learning_rate: 1e-4
weight_decay: Null
clip_by_global_norm: 1.0
lr_schedule: constant
early_stopping:
  patience: 10
  min_delta: 1e-2
  min_steps: 10000

# Data
signal_indices: 0.8
noise_indices: Null
apply_log: true
scale_cut: soft

# Logging / checkpointing
log_every: 100
vali_every: 5000

# Compilation
xla: true
